# On a tag v*, builds LTRFNet for Apple Silicon and Intel with an ad-hoc signature and attaches LTRFNet.zip to a
# GitHub release. It needs no Apple account or secrets.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build
        run: |
          xcodebuild -project LTRFNet.xcodeproj -scheme LTRFNet -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" build
          ditto -c -k --keepParent build/Build/Products/Release/LTRFNet.app LTRFNet.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" LTRFNet.zip --generate-notes
